[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nnbook"
version = "0.1.0"
description = "Companion code for the textbook Neural Networks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "matplotlib==3.11.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
cuda = ["torch==2.14.1", "triton==3.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.setuptools]
packages = ["nnbook"]

[tool.pytest.ini_options]
# Library tests live in tests/; each chapter keeps its tests beside its code.
testpaths = ["tests", "chapter-*"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
